[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-skillsmith"
version = "0.1.0"
description = "Forge successful multimodal agent workflows into reusable, evaluated Agent Skills."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
skillsmith = "skillsmith.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillsmith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
